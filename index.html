<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumeet Elko Appreciation Letters</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }

        /* Logo and Header Section */
        header {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .company-logo {
            max-width: 150px; /* तुमच्या गरजेनुसार लोगोची साईज बदला */
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            color: #1e3c72;
            font-size: 20px;
            text-transform: uppercase;
            border-top: 2px solid #eee;
            padding-top: 10px;
        }

        /* Grid Layout */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .letter-card {
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .letter-card:hover {
            transform: scale(1.03);
            border-color: #1e3c72;
        }

        .letter-card img {
            width: 100%;
            border-radius: 5px;
            display: block;
        }

        /* Lightbox (फोटो मोठा दिसण्यासाठी) */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            text-align: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            margin-top: 5%;
            border: 5px solid white;
            border-radius: 10px;
        }

        #lightbox .close {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Company Logo" class="company-logo" onerror="this.style.display='none'">
        <h1>Sumeet Elko Appreciation Letters</h1>
    </header>

    <div class="gallery-container" id="letterGallery"></div>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="">
        <p style="color:white;">क्लिक करा किंवा बाहेर दाबा बंद करण्यासाठी</p>
    </div>

    <script>
        const gallery = document.getElementById('letterGallery');
        const totalPhotos = 50; 

        for (let i = 1; i <= totalPhotos; i++) {
            const imgName = `IMG (${i}).jpg`; 
            
            const card = document.createElement('div');
            card.className = 'letter-card';
            card.onclick = function() { openLightbox(imgName); };
            
            card.innerHTML = `
                <img src="${imgName}" onerror="this.parentElement.style.display='none'">
                <p style="text-align:center; font-size:12px; color:#777; margin:8px 0 0 0;">View Letter ${i}</p>
            `;
            
            gallery.appendChild(card);
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'block';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
